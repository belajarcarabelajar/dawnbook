name: Test

on:
  push:
    branches: [main, "pr*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install mdBook
        run: |
          MDBOOK_VERSION="v0.5.3"
          curl -sSL "https://github.com/rust-lang/mdbook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          mdbook --version
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build Platform
        run: bun run build
      - name: Run Tests
        run: bun test
      - name: D1 Integration Check (rate-limit UPSERT)
        run: bun run scripts/check-d1-rate-limit.ts
