name: PR Integration (Jules)

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no merges)"
        type: boolean
        default: true
      author_pattern:
        description: "Override Jules detection regex"
        type: string
        default: ""
      pr_number:
        description: "Single PR number to process (empty = all)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Verify gh auth
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run PR Integration Agent
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.author_pattern }}" ]; then ARGS="$ARGS --author-pattern \"${{ inputs.author_pattern }}\""; fi
          if [ -n "${{ inputs.pr_number }}" ]; then ARGS="$ARGS --pr ${{ inputs.pr_number }}"; fi
          bun run scripts/pr-integration-agent.ts $ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_STRATEGY: squash
          JULES_AUTHOR_PATTERN: ${{ inputs.author_pattern }}
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-integration-logs
          path: logs/
          if-no-files-found: warn
