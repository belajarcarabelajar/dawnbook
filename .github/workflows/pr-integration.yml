name: PR Integration (Jules)

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no merges)"
        type: boolean
        default: true
      author_pattern:
        description: "Override Jules detection regex"
        type: string
        default: ""
      pr_number:
        description: "Single PR number to process (empty = all)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Verify gh auth
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run PR Integration Agent
        # Inputs reach the script only through env, never through expression expansion in the script.
        # Only a manual run with dry_run set to false merges; a scheduled run is always a dry run.
        shell: bash
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$INPUT_DRY_RUN" != "false" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$INPUT_AUTHOR_PATTERN" ]; then
            args+=(--author-pattern "$INPUT_AUTHOR_PATTERN")
          fi
          if [ -n "$INPUT_PR_NUMBER" ]; then
            if ! [[ "$INPUT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "pr_number must be digits only" >&2
              exit 1
            fi
            args+=(--pr "$INPUT_PR_NUMBER")
          fi
          bun run scripts/pr-integration-agent.ts "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_STRATEGY: squash
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_AUTHOR_PATTERN: ${{ inputs.author_pattern }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-integration-logs
          path: logs/
          if-no-files-found: warn
