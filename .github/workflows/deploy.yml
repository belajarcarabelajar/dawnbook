name: Deploy Dawnbook

on:
  push:
    branches:
      - main

# One deploy at a time, so each run's live-manifest snapshot already includes
# the books the previous run shipped and a new book is announced only once.
concurrency:
  group: deploy-dawnbook
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install mdBook
        # Match the local toolchain version (mdbook v0.5.3) so the generated
        # output/ is deterministic between local builds and CI.
        run: |
          MDBOOK_VERSION="v0.5.3"
          curl -sSL "https://github.com/rust-lang/mdbook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          mdbook --version
      - name: Install Dependencies
        run: bun install
      - name: Build Platform
        # Public client-side identifiers are injected from repo variables
        # (F-106 removed the hardcoded fallbacks): the built HTML only includes
        # GA and Turnstile when these are set at build time.
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: bun run build
      - name: Snapshot live manifest
        # Baseline for the Telegram announcement (GEMINI.md section 28): a slug
        # missing from the live manifest before this deploy is a new book.
        continue-on-error: true
        run: curl -fsS --max-time 20 https://dawnbook.belajarcarabelajar.com/manifest.json -o "$RUNNER_TEMP/live-manifest.json"
      - name: Deploy to Cloudflare Pages
        # Same command as scripts/deploy-website.sh; cloudflare/pages-action no longer exists upstream.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output --project-name=dawnbook --branch=main --commit-dirty=true
      - name: Announce new books on Telegram
        # Runs only after a successful deploy. A failure here is reported as an
        # annotation but does not fail the deploy; announce by hand with --slug.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAWNBOOK_TELEGRAM_CHAT_ID: ${{ secrets.DAWNBOOK_TELEGRAM_CHAT_ID }}
        run: bun run scripts/announce-new-books.ts --before "$RUNNER_TEMP/live-manifest.json" --after output/manifest.json
