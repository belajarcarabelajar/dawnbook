name: Deploy Dawnbook

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install mdBook
        # Match the local toolchain version (mdbook v0.5.3) so the generated
        # output/ is deterministic between local builds and CI.
        run: |
          MDBOOK_VERSION="v0.5.3"
          curl -sSL "https://github.com/rust-lang/mdbook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          mdbook --version
      - name: Install Dependencies
        run: bun install
      - name: Build Platform
        # Public client-side identifiers are injected from repo variables
        # (F-106 removed the hardcoded fallbacks): the built HTML only includes
        # GA and Turnstile when these are set at build time.
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: dawnbook
          directory: output
