<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 630" width="630" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141f24"/>
      <stop offset="1" stop-color="#34494f"/>
    </linearGradient>
    <pattern id="rain" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M30,0 L14,28" stroke="#7d9ba3" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    </pattern>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <g id="walker">
      <circle cx="0" cy="-50" r="10"/>
      <path d="M-11,-36 C-11,-40 -7,-42 0,-42 C7,-42 11,-40 11,-36 L13,-14 L7,-14 L8,0 L1,0 L0,-12 L-1,0 L-8,0 L-7,-14 L-13,-14 Z"/>
    </g>
  </defs>
  <rect width="630" height="630" fill="url(#sky)"/>
  <rect width="630" height="420" fill="url(#rain)"/>

  <!-- storm clouds -->
  <g fill="#223439">
    <circle cx="60" cy="40" r="70"/>
    <circle cx="160" cy="70" r="58"/>
    <circle cx="250" cy="36" r="64"/>
    <circle cx="360" cy="62" r="54"/>
    <circle cx="460" cy="30" r="70"/>
    <circle cx="570" cy="58" r="66"/>
    <rect x="0" y="0" width="630" height="70"/>
  </g>
  <g fill="#2b4046">
    <circle cx="110" cy="104" r="34"/>
    <circle cx="300" cy="100" r="30"/>
    <circle cx="510" cy="106" r="36"/>
  </g>

  <!-- distant ridge -->
  <path d="M0,470 C80,420 170,380 260,360 C330,345 380,330 440,300 L440,470 Z" fill="#2c4a44"/>

  <!-- calm sea below -->
  <rect x="0" y="470" width="630" height="160" fill="#2f5b66"/>
  <path d="M0,500 C40,488 80,512 120,500 C160,488 200,512 240,500 C280,488 320,512 360,500 L360,630 L0,630 Z" fill="#3e7381"/>
  <path d="M0,550 C40,538 80,562 120,550 C160,538 200,562 240,550 C280,538 320,562 360,550 L360,630 L0,630 Z" fill="#4f8b98"/>

  <!-- high ground -->
  <path d="M90,630 C190,520 300,380 420,280 C490,222 550,190 630,168 L630,630 Z" fill="#3d6b4f"/>
  <path d="M250,630 C330,560 430,470 630,420 L630,630 Z" fill="#2f5940"/>

  <!-- evacuation route -->
  <polyline points="232,624 418,548 338,476 506,404 446,334 590,252" fill="none" stroke="#ffb703" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="232,624 418,548 338,476 506,404 446,334 590,252" fill="none" stroke="#7a5200" stroke-width="4" stroke-dasharray="14 16" stroke-linejoin="round"/>

  <!-- safe assembly point -->
  <circle cx="590" cy="244" r="40" fill="#8fd694" opacity="0.35"/>
  <circle cx="590" cy="244" r="22" fill="#8fd694"/>

  <!-- people walking up calmly -->
  <g fill="#f1e9da">
    <use href="#walker" x="392" y="550"/>
    <use href="#walker" x="472" y="410"/>
    <use href="#walker" x="500" y="338"/>
    <use href="#walker" x="566" y="262"/>
  </g>

  <!-- guide with lamp pointing the way -->
  <circle cx="246" cy="520" r="64" fill="url(#lamp)"/>
  <g fill="#fb8500">
    <circle cx="190" cy="508" r="15"/>
    <path d="M172,526 C172,522 180,520 190,520 C200,520 208,522 208,526 L212,566 L203,566 L204,600 L193,600 L191,572 L189,600 L178,600 L178,566 L168,566 Z"/>
    <path d="M204,530 L238,512" stroke="#fb8500" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="173" y="540" width="35" height="6" fill="#ffe08a"/>
  <circle cx="246" cy="510" r="11" fill="#ffe08a"/>
</svg>
