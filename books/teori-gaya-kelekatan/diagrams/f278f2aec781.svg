<svg id="dbd-f278f2aec781" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="width:100%;max-width:500px;min-width:375px;height:auto;background-color:transparent" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" aria-describedby="chart-desc-dbd-f278f2aec781" aria-labelledby="chart-title-dbd-f278f2aec781"><title id="chart-title-dbd-f278f2aec781">Empat gaya kelekatan menurut citra diri dan citra orang lain</title><desc id="chart-desc-dbd-f278f2aec781">Bidang dua sumbu dengan citra diri di sumbu mendatar dan citra orang lain di sumbu tegak. Citra diri positif dan citra orang lain positif adalah gaya aman, citra diri negatif dan citra orang lain positif adalah gaya cemas, citra diri positif dan citra orang lain negatif adalah gaya menghindar, sedangkan citra diri negatif dan citra orang lain negatif adalah gaya takut-menghindar.</desc><style>#dbd-f278f2aec781{font-family:Epilogue,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#dbd-f278f2aec781 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#dbd-f278f2aec781 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#dbd-f278f2aec781 .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#dbd-f278f2aec781 .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#dbd-f278f2aec781 .edge-thickness-normal{stroke-width:1px;}#dbd-f278f2aec781 .edge-thickness-thick{stroke-width:3.5px;}#dbd-f278f2aec781 .edge-pattern-solid{stroke-dasharray:0;}#dbd-f278f2aec781 .edge-thickness-invisible{stroke-width:0;fill:none;}#dbd-f278f2aec781 .edge-pattern-dashed{stroke-dasharray:3;}#dbd-f278f2aec781 .edge-pattern-dotted{stroke-dasharray:2;}#dbd-f278f2aec781 .marker{fil