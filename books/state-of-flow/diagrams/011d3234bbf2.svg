<svg id="dbd-011d3234bbf2" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="width:100%;max-width:500px;min-width:375px;height:auto;background-color:transparent" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" aria-describedby="chart-desc-dbd-011d3234bbf2" aria-labelledby="chart-title-dbd-011d3234bbf2"><title id="chart-title-dbd-011d3234bbf2">Delapan kondisi pengalaman menurut tantangan dan keterampilan</title><desc id="chart-desc-dbd-011d3234bbf2">Grafik dua sumbu dengan keterampilan di sumbu mendatar dan tantangan di sumbu tegak, masing-masing bertingkat rendah, menengah, dan tinggi. Flow berada pada tantangan tinggi dan keterampilan tinggi, Control pada tantangan menengah dan keterampilan tinggi, Relaxation pada tantangan rendah dan keterampilan tinggi, Boredom pada tantangan rendah dan keterampilan menengah, Apathy pada tantangan rendah dan keterampilan rendah, Worry pada tantangan menengah dan keterampilan rendah, Anxiety pada tantangan tinggi dan keterampilan rendah, serta Arousal pada tantangan tinggi dan keterampilan menengah.</desc><style>#dbd-011d3234bbf2{font-family:Epilogue,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#dbd-011d3234bbf2 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#dbd-011d3234bbf2 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#dbd-011d3234bbf2 .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#dbd-011d3234bbf2 .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#dbd-011d3234bbf2 .edge-thickness-normal{stroke-width:1px;}#dbd-011d3234bbf2 .edge-thickness-thick{stroke-width:3.5px;}#dbd-011d3234bbf2 .edge-pattern-solid{stroke-dasharray:0;}#